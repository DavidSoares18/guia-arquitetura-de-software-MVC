numero: "03"
slug: "mvc"
titulo: "MVC (Model-View-Controller)"
subtitulo: "Separando estado, apresentação e interação em sistemas interativos"
resumo: >-
  O MVC divide uma aplicação interativa em Model (estado e regras de negócio),
  View (apresentação) e Controller (entrada do usuário). Criado por Trygve
  Reenskaug no Xerox PARC em 1979 para resolver o acoplamento entre interface e
  lógica, o padrão continua sendo a base de muitos frameworks web e de interface.

